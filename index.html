<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk dengan Nombor Telefon · Malaysia OTP Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight:#0F1B3C;
    --midnight-2:#152250;
    --gold:#E8B94A;
    --gold-soft:#f3d998;
    --crimson:#C8373C;
    --paper:#F7F5F1;
    --slate:#8B93AC;
    --line: rgba(232,185,74,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(232,185,74,0.10), transparent 60%),
      radial-gradient(900px 500px at 110% 20%, rgba(200,55,60,0.14), transparent 55%),
      var(--midnight);
    font-family:'Inter',sans-serif;
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow-x:hidden;
  }

  /* ambient coastline wave — signature background element */
  .coastline{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.5;
  }
  .coastline svg{width:100%;height:100%;}
  .coastline path{
    fill:none; stroke:var(--gold); stroke-width:1; stroke-opacity:0.15;
  }

  .wrap{
    position:relative; z-index:1;
    width:100%; max-width:420px;
  }

  .eyebrow{
    display:flex; align-items:center; gap:10px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--gold-soft); margin-bottom:18px;
  }
  .eyebrow .dot{
    width:7px;height:7px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 4px rgba(232,185,74,0.15);
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(28px,5vw,36px);
    line-height:1.15;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--slate); font-size:14.5px; line-height:1.6; margin:0 0 32px;
    max-width:38ch;
  }

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px;
    backdrop-filter:blur(6px);
  }

  .field-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--slate); display:block; margin-bottom:10px;
  }

  .phone-row{
    display:flex; align-items:center;
    border:1px solid rgba(255,255,255,0.14);
    border-radius:12px;
    background:rgba(0,0,0,0.18);
    overflow:hidden;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .phone-row:focus-within{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(232,185,74,0.12);
  }
  .flag-code{
    display:flex; align-items:center; gap:8px;
    padding:14px 14px; font-family:'JetBrains Mono',monospace; font-size:14.5px;
    color:var(--gold-soft); border-right:1px solid rgba(255,255,255,0.1);
    white-space:nowrap;
  }
  input[type=tel], input[type=text]{
    flex:1; min-width:0;
    background:transparent; border:none; outline:none;
    color:var(--paper); font-family:'JetBrains Mono',monospace;
    font-size:15px; padding:14px; letter-spacing:0.02em;
  }
  input::placeholder{color:rgba(247,245,241,0.32);}

  .otp-row{
    display:flex; gap:10px; margin-top:6px;
  }
  .otp-row input{
    width:100%; text-align:center; padding:14px 0;
    border:1px solid rgba(255,255,255,0.14);
    border-radius:10px; background:rgba(0,0,0,0.18);
    font-size:19px; letter-spacing:0;
  }
  .otp-row input:focus{
    border-color:var(--gold); outline:none;
    box-shadow:0 0 0 3px rgba(232,185,74,0.12);
  }

  button.primary{
    width:100%; margin-top:20px;
    padding:14px 18px; border:none; border-radius:12px;
    background:var(--gold); color:var(--midnight);
    font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px;
    cursor:pointer; transition:transform .15s ease, background .15s ease;
    position:relative; overflow:hidden;
  }
  button.primary:hover{background:var(--gold-soft);}
  button.primary:active{transform:scale(0.98);}
  button.primary:disabled{opacity:0.55; cursor:not-allowed;}

  .pulse-bar{
    height:2px; width:100%; margin-top:22px;
    background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden;
    display:none;
  }
  .pulse-bar.active{display:block;}
  .pulse-bar span{
    display:block; height:100%; width:34%;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%{transform:translateX(-120%);}
    100%{transform:translateX(340%);}
  }

  .msg{
    font-size:13px; line-height:1.6; margin-top:16px; padding:12px 14px;
    border-radius:10px; display:none;
  }
  .msg.show{display:block;}
  .msg.error{background:rgba(200,55,60,0.14); color:#ff9d9f; border:1px solid rgba(200,55,60,0.3);}
  .msg.info{background:rgba(232,185,74,0.1); color:var(--gold-soft); border:1px solid var(--line);}
  .msg.success{background:rgba(80,180,120,0.12); color:#9fe0b8; border:1px solid rgba(80,180,120,0.28);}

  .link-btn{
    background:none; border:none; color:var(--slate); font-family:'Inter',sans-serif;
    font-size:13px; cursor:pointer; padding:0; margin-top:16px; text-decoration:underline;
    text-underline-offset:3px;
  }
  .link-btn:hover{color:var(--gold-soft);}

  .signed-in{
    text-align:center;
  }
  .signed-in .badge{
    width:52px;height:52px;border-radius:50%;
    background:rgba(232,185,74,0.12); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px; font-size:22px;
  }
  .signed-in .num{
    font-family:'JetBrains Mono',monospace; color:var(--gold-soft); font-size:15px;
  }

  .hidden{display:none !important;}

  footer{
    margin-top:22px; text-align:center; color:var(--slate);
    font-size:12px; font-family:'JetBrains Mono',monospace; letter-spacing:0.02em;
  }

  @media (prefers-reduced-motion: reduce){
    .pulse-bar span{animation:none;}
    button.primary{transition:none;}
  }
</style>
</head>
<body>

<div class="coastline">
  <svg viewBox="0 0 800 800" preserveAspectRatio="none">
    <path d="M0,600 C150,560 250,650 400,600 C550,550 650,640 800,590" />
    <path d="M0,680 C180,640 300,720 450,670 C600,620 700,700 800,660" />
  </svg>
</div>

<div class="wrap">
  <div class="eyebrow"><span class="dot"></span> +60 · Nombor Telefon Malaysia</div>
  <h1>Masuk dengan<br>satu kod OTP.</h1>
  <p class="sub">Masukkan nombor telefon anda, kami hantar kod 6-digit melalui SMS. Tiada kata laluan untuk diingati.</p>

  <div class="card">

    <!-- STEP 1: phone number -->
    <div id="step-phone">
      <label class="field-label">Nombor Telefon</label>
      <div class="phone-row">
        <span class="flag-code">🇲🇾 +60</span>
        <input type="tel" id="phone-input" placeholder="12-345 6789" inputmode="numeric">
      </div>
      <button class="primary" id="send-otp-btn">Hantar Kod OTP</button>
      <div id="recaptcha-container"></div>
    </div>

    <!-- STEP 2: otp -->
    <div id="step-otp" class="hidden">
      <label class="field-label">Kod OTP (6 digit)</label>
      <div class="otp-row">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
      </div>
      <button class="primary" id="verify-otp-btn">Sahkan &amp; Masuk</button>
      <button class="link-btn" id="resend-btn">Hantar semula kod</button>
      <button class="link-btn" id="change-number-btn">Tukar nombor telefon</button>
    </div>

    <!-- STEP 3: signed in -->
    <div id="step-signed-in" class="signed-in hidden">
      <div class="badge">✓</div>
      <p style="margin:0 0 4px;font-family:'Fraunces',serif;font-size:19px;">Berjaya masuk</p>
      <p class="num" id="signed-in-number">+60 12-345 6789</p>
      <button class="primary" id="logout-btn" style="margin-top:22px;">Log Keluar</button>
    </div>

    <div class="pulse-bar" id="pulse-bar"><span></span></div>
    <div class="msg" id="msg-box"></div>
  </div>

  <footer>Firebase Phone Authentication · secured session</footer>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
/* ======================================================
   1. APNI FIREBASE CONFIG YAHAN DAALEIN
   Firebase Console > Project Settings > General > Your apps > SDK setup
   ====================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBGxSWUwRwKHofWotoA6_k1PcpXjG3PimY",
  authDomain: "otp-login-3c05f.firebaseapp.com",
  projectId: "otp-login-3c05f",
  storageBucket: "otp-login-3c05f.firebasestorage.app",
  messagingSenderId: "972453214054",
  appId: "1:972453214054:web:3435100170047409597aa7"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* ---------- DOM refs ---------- */
const stepPhone   = document.getElementById('step-phone');
const stepOtp      = document.getElementById('step-otp');
const stepSignedIn = document.getElementById('step-signed-in');
const phoneInput   = document.getElementById('phone-input');
const sendBtn      = document.getElementById('send-otp-btn');
const verifyBtn    = document.getElementById('verify-otp-btn');
const resendBtn    = document.getElementById('resend-btn');
const changeBtn    = document.getElementById('change-number-btn');
const logoutBtn    = document.getElementById('logout-btn');
const otpDigits    = Array.from(document.querySelectorAll('.otp-digit'));
const pulseBar     = document.getElementById('pulse-bar');
const msgBox       = document.getElementById('msg-box');
const signedInNum  = document.getElementById('signed-in-number');

let confirmationResult = null;
let recaptchaVerifier   = null;

/* ---------- helpers ---------- */
function showMsg(text, type){
  msgBox.textContent = text;
  msgBox.className = 'msg show ' + type;
}
function clearMsg(){
  msgBox.className = 'msg';
  msgBox.textContent = '';
}
function setLoading(isLoading){
  pulseBar.classList.toggle('active', isLoading);
  sendBtn.disabled = isLoading;
  verifyBtn.disabled = isLoading;
}
function normalizedPhone(){
  // strips spaces/dashes, ensures +60 prefix
  let digits = phoneInput.value.replace(/[^0-9]/g,'');
  if(digits.startsWith('0')) digits = digits.slice(1); // local 012... -> 12...
  return '+60' + digits;
}

/* reCAPTCHA — set up fresh each time so a failed attempt can retry cleanly */
function setupRecaptcha(){
  if(recaptchaVerifier){
    recaptchaVerifier.clear();
  }
  recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
    size: 'invisible'
  });
}
setupRecaptcha();

/* ---------- STEP 1: send OTP ---------- */
sendBtn.addEventListener('click', async () => {
  clearMsg();
  const phone = normalizedPhone();

  if(!/^\+60\d{9,10}$/.test(phone)){
    showMsg('Sila masukkan nombor telefon Malaysia yang sah (cth: 12-345 6789).', 'error');
    return;
  }

  setLoading(true);
  try{
    confirmationResult = await auth.signInWithPhoneNumber(phone, recaptchaVerifier);
    setLoading(false);
    showMsg('Kod OTP telah dihantar melalui SMS.', 'info');
    stepPhone.classList.add('hidden');
    stepOtp.classList.remove('hidden');
    otpDigits[0].focus();
  }catch(err){
    setLoading(false);
    console.error(err);
    showMsg(friendlyError(err), 'error');
    setupRecaptcha(); // reset so user can retry without a stale verifier
  }
});

/* ---------- OTP digit auto-advance ---------- */
otpDigits.forEach((el, i) => {
  el.addEventListener('input', () => {
    el.value = el.value.replace(/[^0-9]/g,'');
    if(el.value && i < otpDigits.length - 1) otpDigits[i+1].focus();
  });
  el.addEventListener('keydown', (e) => {
    if(e.key === 'Backspace' && !el.value && i > 0) otpDigits[i-1].focus();
  });
});

/* ---------- STEP 2: verify OTP ---------- */
verifyBtn.addEventListener('click', async () => {
  clearMsg();
  const code = otpDigits.map(d => d.value).join('');
  if(code.length !== 6){
    showMsg('Sila masukkan kod 6-digit yang lengkap.', 'error');
    return;
  }
  if(!confirmationResult){
    showMsg('Sesi tamat. Sila hantar semula kod OTP.', 'error');
    return;
  }

  setLoading(true);
  try{
    const result = await confirmationResult.confirm(code);
    setLoading(false);
    signedInNum.textContent = result.user.phoneNumber;
    stepOtp.classList.add('hidden');
    stepSignedIn.classList.remove('hidden');
    clearMsg();
  }catch(err){
    setLoading(false);
    console.error(err);
    showMsg(friendlyError(err), 'error');
  }
});

/* ---------- resend ---------- */
resendBtn.addEventListener('click', () => {
  otpDigits.forEach(d => d.value = '');
  setupRecaptcha();
  sendBtn.click();
});

/* ---------- change number ---------- */
changeBtn.addEventListener('click', () => {
  confirmationResult = null;
  otpDigits.forEach(d => d.value = '');
  stepOtp.classList.add('hidden');
  stepPhone.classList.remove('hidden');
  clearMsg();
  setupRecaptcha();
});

/* ---------- logout: this is the part that prevents "error on repeat login" ----------
   We always drive the UI off Firebase's own auth state (onAuthStateChanged) instead of
   a manual flag. That way, no matter how many times someone logs in/out, the UI and the
   real session are always in sync — no leftover state, no ghost errors. */
logoutBtn.addEventListener('click', async () => {
  await auth.signOut();
});

auth.onAuthStateChanged((user) => {
  if(user){
    signedInNum.textContent = user.phoneNumber;
    stepPhone.classList.add('hidden');
    stepOtp.classList.add('hidden');
    stepSignedIn.classList.remove('hidden');
  } else {
    stepSignedIn.classList.add('hidden');
    stepOtp.classList.add('hidden');
    stepPhone.classList.remove('hidden');
    phoneInput.value = '';
    otpDigits.forEach(d => d.value = '');
    confirmationResult = null;
  }
  clearMsg();
});

/* ---------- error messages, in Malay, mapped from Firebase codes ---------- */
function friendlyError(err){
  const map = {
    'auth/invalid-phone-number': 'Format nombor telefon tidak sah.',
    'auth/too-many-requests': 'Terlalu banyak percubaan. Sila cuba sebentar lagi.',
    'auth/quota-exceeded': 'Had SMS harian telah dicapai. Sila cuba esok.',
    'auth/code-expired': 'Kod OTP telah luput. Sila hantar semula.',
    'auth/invalid-verification-code': 'Kod OTP tidak sah. Sila semak semula.',
    'auth/network-request-failed': 'Sambungan internet bermasalah.'
  };
  return map[err.code] || 'Sesuatu tidak kena. Sila cuba semula.';
}
</script>
</body>
  </html>
